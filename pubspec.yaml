name: cash_vault
description: A private offline-first cash tracking app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Encryption & Secure Storage
  flutter_secure_storage: ^9.2.4

  # State Management
  provider: ^6.1.2

  # Firebase (optional auth) — uncomment after adding google-services.json
  # firebase_core: ^3.8.1
  # firebase_auth: ^5.4.1
  # google_sign_in: ^6.2.2
  # cloud_firestore: ^5.5.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  local_auth: ^3.0.1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
